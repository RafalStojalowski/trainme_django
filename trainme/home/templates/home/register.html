<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rejestracja — Train.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --pink: #FF52A2;
            --bg: #FAFAFA;
            --surface: #ffffff;
            --border: #eaeaea;
            --text: #111111;
            --muted: #666666;
            --radius: 18px;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .auth-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 4px 40px rgba(0,0,0,0.06);
            padding: 40px 36px;
            width: 100%;
            max-width: 380px;
        }
        .auth-brand {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .auth-brand span { color: var(--pink); }
        .auth-subtitle {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 28px;
        }
        .field {
            margin-bottom: 16px;
        }
        .field label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            outline: none;
            transition: border-color 0.15s;
        }
        .field input:focus { border-color: var(--pink); }
        .field .helptext {
            display: block;
            font-size: 11px;
            color: var(--muted);
            margin-top: 5px;
            line-height: 1.5;
        }
        .field .errorlist {
            list-style: none;
            margin-top: 5px;
        }
        .field .errorlist li {
            font-size: 12px;
            color: #ef4444;
        }
        .btn-submit {
            width: 100%;
            padding: 13px;
            background: var(--pink);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s, transform 0.15s;
        }
        .btn-submit:hover { background: #e03d8a; transform: translateY(-1px); }
        .auth-footer {
            margin-top: 22px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
        .auth-footer a {
            color: var(--pink);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="auth-brand">Train<span>.me</span></div>
    <div class="auth-subtitle">Stwórz konto i zacznij rozmowę</div>

    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="field">
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}<span class="helptext">{{ field.help_text }}</span>{% endif %}
            {% if field.errors %}<ul class="errorlist">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn-submit">Zarejestruj się</button>
    </form>

    <div class="auth-footer">
        Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a>
    </div>
</div>
</body>
</html>
